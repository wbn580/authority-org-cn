# wrangler.toml — Cloudflare Workers + Static Assets
name = "authority-org-cn-worker"
main = "worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
not_found_handling = "404-page"
directory = "dist"
binding = "ASSETS"

# 运行时文章层（R254，d1_runtime_scaffold 生成）。只存还没进构建产物的
# 新文章，静态正本优先。刻意不设 run_worker_first：Worker 只接管构建产物里
# 根本不存在的路径（云构建等价闸按 dist manifest 逐文件核 sha256）。
[[d1_databases]]
binding = "DB"
database_name = "authority-org-cn-content"
database_id = "0060c60b-0122-462e-8b1b-05ab778cd03c"
